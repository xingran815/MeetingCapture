name: CI

# A push to main is main.yml. These results are what protect-main checks, on the
# same commit, so main doesn't run these seven again.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Logic lives in scripts/ci.sh, so every job can be run locally too.
# The PR head is checked out, not GitHub's merge ref: that merge commit carries
# GitHub's identity and would trip the identity sweep. History is needed for the sweeps.
env:
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  test:
    name: Build and unit tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - id: cache-id
        run: scripts/ci.sh cache-id >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swiftbuild-test-${{ steps.cache-id.outputs.id }}-${{ env.HEAD_SHA }}
          restore-keys: |
            swiftbuild-test-${{ steps.cache-id.outputs.id }}-
            swiftbuild-main-${{ steps.cache-id.outputs.id }}-
      - run: scripts/ci.sh test

  leaks:
    name: Secret and leak scan
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/ci.sh leaks

  identity:
    name: Commit identity
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/ci.sh identity

  lint:
    name: Lint and format
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - run: scripts/ci.sh lint

  deps:
    name: Dependencies
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - run: scripts/ci.sh deps

  fresh:
    name: Fresh clone
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - run: scripts/ci.sh fresh

  e2e:
    name: Short-audio E2E
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/whisper-ci
          key: whisper-model-${{ hashFiles('scripts/ci-fetch-model.sh') }}
      - id: cache-id
        run: scripts/ci.sh cache-id >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swiftbuild-e2e-${{ steps.cache-id.outputs.id }}-${{ env.HEAD_SHA }}
          restore-keys: |
            swiftbuild-e2e-${{ steps.cache-id.outputs.id }}-
            swiftbuild-main-${{ steps.cache-id.outputs.id }}-
      - run: scripts/ci.sh e2e
